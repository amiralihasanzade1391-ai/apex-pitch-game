<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#121829"/>
      <stop offset="100%" stop-color="#0A0E1A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFDF00"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B38F24"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#17D3C2"/>
      <stop offset="100%" stop-color="#0FA89A"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Gold border -->
  <rect x="8" y="8" width="496" height="496" rx="88" fill="none" stroke="url(#gold)" stroke-width="4" opacity="0.5"/>
  <!-- Shield shape -->
  <path d="M256 80 L380 140 L380 300 Q380 400 256 440 Q132 400 132 300 L132 140 Z" fill="none" stroke="url(#gold)" stroke-width="6"/>
  <path d="M256 95 L368 150 L368 295 Q368 385 256 425 Q144 385 144 295 L144 150 Z" fill="url(#bg)" opacity="0.8"/>
  <!-- AP text -->
  <text x="256" y="300" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="140" fill="url(#gold)" letter-spacing="4">AP</text>
  <!-- Small teal dot -->
  <circle cx="256" cy="340" r="8" fill="url(#teal)"/>
</svg>
